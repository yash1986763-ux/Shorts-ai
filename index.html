<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shorts AI</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
  text-align:center;
}

.container{
  max-width:700px;
  margin:auto;
  padding:30px 15px;
}

h1{
  font-size:32px;
}

.card{
  background:#1f2937;
  padding:25px;
  border-radius:18px;
  margin-top:20px;
}

input{
  margin:20px;
  padding:12px;
}

button{
  background:#7c3aed;
  color:white;
  border:0;
  padding:14px 25px;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

video{
  width:100%;
  max-height:400px;
  margin-top:20px;
  border-radius:12px;
}

#status{
  margin:20px;
  color:#c4b5fd;
}

a{
  display:inline-block;
  margin-top:20px;
  color:white;
  background:#16a34a;
  padding:14px 25px;
  border-radius:10px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Shorts AI</h1>
<p>Long Video → Vertical Short</p>

<div class="card">

<h2>अपना वीडियो चुनें</h2>

<input type="file" id="fileInput" accept="video/*">

<video id="video" controls style="display:none"></video>

<br>

<button id="createBtn" disabled>
Create 9:16 Short
</button>

<div id="status"></div>

<a id="download" style="display:none">
⬇️ Short Download करें
</a>

</div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const video = document.getElementById("video");
const createBtn = document.getElementById("createBtn");
const status = document.getElementById("status");
const download = document.getElementById("download");

let videoURL = "";

fileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    videoURL = URL.createObjectURL(file);

    video.src = videoURL;
    video.style.display = "block";

    createBtn.disabled = false;

    status.textContent = "वीडियो तैयार है ✅";

});

createBtn.addEventListener("click", async function(){

    createBtn.disabled = true;
    download.style.display = "none";

    status.textContent =
    "9:16 Short बनाया जा रहा है... कृपया इंतज़ार करें ⏳";

    video.currentTime = 0;

    await new Promise(resolve => {

        if(video.readyState >= 2){
            resolve();
        }else{
            video.onloadeddata = resolve;
        }

    });

    const canvas = document.createElement("canvas");

    canvas.width = 720;
    canvas.height = 1280;

    const ctx = canvas.getContext("2d");

    const stream = canvas.captureStream(30);

    let recorder;

    try{

        recorder = new MediaRecorder(stream,{
            mimeType:"video/webm;codecs=vp9"
        });

    }catch(e){

        recorder = new MediaRecorder(stream);

    }

    const chunks = [];

    recorder.ondataavailable = e => {

        if(e.data.size > 0){
            chunks.push(e.data);
        }

    };

    recorder.onstop = () => {

        const blob = new Blob(chunks,{
            type:"video/webm"
        });

        const url = URL.createObjectURL(blob);

        download.href = url;
        download.download = "shorts-ai-short.webm";
        download.style.display = "inline-block";

        status.textContent =
        "🎉 आपका 9:16 Short तैयार है!";

        createBtn.disabled = false;

    };

    recorder.start();

    video.currentTime = 0;

    video.play();

    const maxDuration = Math.min(video.duration,60);

    const startTime = performance.now();

    function draw(){

        if(recorder.state === "inactive"){
            return;
        }

        const elapsed =
        (performance.now() - startTime) / 1000;

        if(elapsed >= maxDuration){

            video.pause();
            recorder.stop();

            return;
        }

        const vw = video.videoWidth;
        const vh = video.videoHeight;

        const targetRatio = 9/16;
        const videoRatio = vw/vh;

        let sx,sy,sw,sh;

        if(videoRatio > targetRatio){

            sh = vh;
            sw = vh * targetRatio;

            sx = (vw-sw)/2;
            sy = 0;

        }else{

            sw = vw;
            sh = vw / targetRatio;

            sx = 0;
            sy = (vh-sh)/2;

        }

        ctx.fillStyle = "black";
        ctx.fillRect(0,0,720,1280);

        ctx.drawImage(
            video,
            sx,sy,sw,sh,
            0,0,720,1280
        );

        requestAnimationFrame(draw);

    }

    draw();

});

</script>

</body>
</html>
